# Publish clawprint to npm when a GitHub release is published.
#
# Flow: bump package.json -> tag vX.Y.Z -> create the GitHub release -> this
# workflow tests (unit + selftest), verifies tag/package version agreement,
# publishes, and attaches the exact tarball to the release as an asset.
#
# Required repo secret: NPM_TOKEN — an npm "Automation" access token (or a
# granular token with 2FA-bypass) that can publish `clawprint`.
#
# workflow_dispatch exists for re-runs / publishing a release created before
# this workflow existed: pass the tag (e.g. v0.3.0).
name: release-npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write # attach the tarball to the release

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing for tag: $TAG"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${{ steps.tag.outputs.tag }}"
          if [ "v$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION — refusing to publish."
            exit 1
          fi
          if npm view "clawprint@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::error::clawprint@$PKG_VERSION already exists on npm."
            exit 1
          fi

      - name: Tests + fixture selftest
        run: |
          node --test
          node clawprint.mjs --selftest

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach the published tarball to the GitHub release
        run: |
          npm pack
          gh release upload "${{ steps.tag.outputs.tag }}" clawprint-*.tgz --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
